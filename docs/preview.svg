<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" font-family="-apple-system, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e9edf3"/>
      <stop offset="1" stop-color="#d7dbe6"/>
    </linearGradient>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6d7bed"/>
      <stop offset="1" stop-color="#a06ce0"/>
    </linearGradient>
    <radialGradient id="sheen" cx="0.5" cy="0" r="0.9">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.09"/>
      <stop offset="0.6" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="20" stdDeviation="22" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- desktop -->
  <rect width="960" height="440" fill="url(#bg)"/>
  <rect x="70" y="70" width="820" height="330" rx="16" fill="url(#wall)" opacity="0.9"/>
  <rect x="70" y="70" width="820" height="330" rx="16" fill="none" stroke="#ffffff" stroke-opacity="0.25"/>

  <!-- menu bar -->
  <rect x="70" y="70" width="820" height="30" rx="16" fill="#1b1b22" opacity="0.55"/>
  <rect x="70" y="86" width="820" height="14" fill="#1b1b22" opacity="0.55"/>
  <g fill="#ffffff" fill-opacity="0.85" font-size="12.5" font-weight="600">
    <text x="92" y="90"></text>
    <text x="120" y="90">aina</text>
    <text x="168" y="90" font-weight="400" fill-opacity="0.7">File</text>
    <text x="208" y="90" font-weight="400" fill-opacity="0.7">Edit</text>
  </g>
  <g fill="#ffffff" fill-opacity="0.8" font-size="12.5" text-anchor="end">
    <text x="868" y="90">16:24</text>
    <text x="806" y="90" fill-opacity="0.6">Tue</text>
  </g>

  <!-- ROOST panel: absolute-black, fused with + hiding the notch -->
  <g filter="url(#soft)">
    <path d="M 290 70 H 670 V 300 a 26 26 0 0 1 -26 26 H 316 a 26 26 0 0 1 -26 -26 Z" fill="#000000"/>
  </g>
  <path d="M 290 70 H 670 V 300 a 26 26 0 0 1 -26 26 H 316 a 26 26 0 0 1 -26 -26 Z" fill="url(#sheen)"/>
  <path d="M 291 70 H 669 V 300 a 25 25 0 0 1 -25 25 H 316 a 25 25 0 0 1 -25 -25 Z" fill="none" stroke="#ffffff" stroke-opacity="0.07"/>
  <!-- grip -->
  <rect x="463" y="84" width="34" height="4" rx="2" fill="#ffffff" fill-opacity="0.16"/>

  <!-- rows -->
  <g font-family="-apple-system, Helvetica, Arial, sans-serif">
    <!-- row 1: thinking -->
    <g transform="translate(306,104)">
      <circle cx="10" cy="25" r="4.5" fill="#7aa2ff"/>
      <circle cx="10" cy="25" r="9" fill="none" stroke="#7aa2ff" stroke-opacity="0.35"/>
      <text x="28" y="21" fill="#ffffff" font-size="13.5" font-weight="600">aina-app</text>
      <text x="28" y="37" fill="#ffffff" fill-opacity="0.44" font-size="11">Read app-sidebar.tsx</text>
      <text x="300" y="29" fill="#7aa2ff" font-size="10.5" text-anchor="end">thinking</text>
      <g transform="translate(312,17)" fill="none" stroke="#ffffff" stroke-opacity="0.45" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M7 3 3.5 6H1v5h2.5L7 14z"/><path d="M10 5.5a4 4 0 0 1 0 6"/>
      </g>
    </g>
    <!-- row 2: done -->
    <g transform="translate(306,152)">
      <rect x="-6" y="2" width="356" height="46" rx="14" fill="#ffffff" fill-opacity="0.05"/>
      <circle cx="10" cy="25" r="4.5" fill="#3ad17f"/>
      <text x="28" y="21" fill="#ffffff" font-size="13.5" font-weight="600">portfolio</text>
      <text x="28" y="37" fill="#ffffff" fill-opacity="0.44" font-size="11">Edit index.html</text>
      <text x="300" y="29" fill="#3ad17f" font-size="10.5" text-anchor="end">done</text>
      <g transform="translate(312,17)" fill="none" stroke="#ffffff" stroke-opacity="0.45" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M7 3 3.5 6H1v5h2.5L7 14z"/><path d="M10 5.5a4 4 0 0 1 0 6"/>
      </g>
    </g>
    <!-- row 3: waiting (muted) -->
    <g transform="translate(306,200)">
      <circle cx="10" cy="25" r="4.5" fill="#ffb020"/>
      <text x="28" y="21" fill="#ffffff" fill-opacity="0.5" font-size="13.5" font-weight="600">x-growth-tool</text>
      <text x="28" y="37" fill="#ffffff" fill-opacity="0.32" font-size="11">needs your permission</text>
      <text x="300" y="29" fill="#ffb020" font-size="10.5" text-anchor="end">waiting</text>
      <g transform="translate(312,17)" fill="none" stroke="#ffb020" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M7 3 3.5 6H1v5h2.5L7 14z"/><line x1="1" y1="15" x2="15" y2="1"/>
      </g>
    </g>
  </g>

  <!-- caption -->
  <text x="480" y="360" text-anchor="middle" fill="#4a4f5e" font-size="13" font-weight="600">Roost — your Claude Code sessions, watched from the notch</text>
</svg>
